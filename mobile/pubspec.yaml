name: autimate
description: "AutiMate accessible communication and learning support app."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.9.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Justification: hashes the caregiver PIN; nothing in the current
  # dependency set provides secure hashing.
  crypto: ^3.0.6
  # Justification (Module 11 backend): the scope requires Firebase Auth for
  # caregiver accounts and Firestore for structured sync. All three sit
  # behind the existing repository interfaces and are only constructed when
  # `AppConfig.firebaseConfigured` is true, so the app stays fully runnable
  # with no credentials at all.
  cloud_firestore: ^5.6.0
  firebase_auth: ^5.3.4
  firebase_core: ^3.8.1
  flutter_riverpod: ^2.6.1
  flutter_tts: ^4.2.5
  # Justification (Module 3 expression practice): streams camera frames for
  # on-device face analysis. Frames stay in memory and are never written or
  # uploaded. Used only behind `ExpressionPracticeService`.
  camera: ^0.11.0+2
  # Justification: on-device face detection. Runs entirely locally — no
  # network call, no image leaves the device — which is what makes the
  # camera feature acceptable at all for this audience.
  google_mlkit_face_detection: ^0.13.1
  # Justification: the camera permission flow needs the real OS answer,
  # including the permanently-denied case that must send a caregiver to
  # settings rather than re-prompting forever.
  permission_handler: ^11.3.1
  # Justification: caregiver custom AAC cards need a photo of the child's
  # own object/person. Nothing else in the dependency set can reach the
  # gallery or camera. Used only behind `ImageSourceService`.
  image_picker: ^1.1.2
  # Justification: plays the bundled calming ambient loops. Nothing else in
  # the set can reach the platform audio output, and the calm screen's
  # gentle-sound option was a silent no-op without it. Used only behind
  # `AmbientSoundService`.
  audioplayers: ^6.1.0
  # Justification: custom-card images are copied into the app documents
  # directory so they survive restarts and stay offline-first. Only the
  # platform can report that directory.
  path_provider: ^2.1.5
  shared_preferences: ^2.3.4

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Justification (build-time only, never shipped): generates the launcher
  # and adaptive icons from a single source image so the Android density
  # buckets cannot drift apart by hand.
  flutter_launcher_icons: ^0.14.3
  # Justification (test-only): an in-memory Firestore so the adapters are
  # covered by real tests without a live project, credentials, or an
  # emulator running. Never shipped.
  fake_cloud_firestore: ^3.1.0
  # Justification (build-time only): writes the native splash so the first
  # frame is the app's own calm ground rather than a white flash — a white
  # flash is exactly the kind of sudden luminance change this app avoids.
  flutter_native_splash: ^2.4.4

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/audio/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Design-system fonts, bundled (never fetched at runtime — the app is
  # offline-first). Both are SIL OFL 1.1; licences sit beside the binaries.
  #
  # These are variable fonts with a `wght` axis, so one file covers the whole
  # weight range and Flutter interpolates rather than swapping static cuts.
  # See assets/fonts/README.md.
  fonts:
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend[wght].ttf
    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu[wght].ttf
  #   - family: NotoNastaliqUrdu
  #     fonts:
  #       - asset: assets/fonts/NotoNastaliqUrdu-Regular.ttf
  #       - asset: assets/fonts/NotoNastaliqUrdu-Bold.ttf
  #         weight: 700

# Launcher and adaptive icons. Source art is generated from the same mascot
# the app draws in Dart (see tool/make_icon.py), so the home-screen icon is
# the character the child meets inside.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#F6F7F5"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  remove_alpha_ios: true

# Native splash. The ground colour is the app's own canvas token in each
# theme, so launching never flashes white.
flutter_native_splash:
  color: "#F6F7F5"
  color_dark: "#12161A"
  image: assets/icon/splash.png
  android_12:
    color: "#F6F7F5"
    color_dark: "#12161A"
    image: assets/icon/app_icon_foreground.png
