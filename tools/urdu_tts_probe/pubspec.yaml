name: urdu_tts_probe
description: >-
  A throwaway probe that answers one question: does this Android phone have a
  usable Urdu text-to-speech voice? Run it on the physical demo device on Day 0.
publish_to: "none"
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
